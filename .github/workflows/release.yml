name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  release:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'development'
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine bump type from PR labels
        id: bump_type
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$LABELS" | grep -q '"major"'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q '"minor"'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version in package.json
        id: bump
        run: |
          BUMP_TYPE="${{ steps.bump_type.outputs.type }}"
          OLD_VERSION=$(node -p "require('./package.json').version")

          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD_VERSION"
          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          TAG="v$NEW_VERSION"

          # Write new version
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '$NEW_VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"             >> "$GITHUB_OUTPUT"
          echo "Bumped $OLD_VERSION → $NEW_VERSION ($BUMP_TYPE)"

      - name: Commit version bump
        run: |
          git add package.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push origin main

      - name: Build changelog
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -uo pipefail
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          TAB=$'\t'

          # 1. Hand-written notes: the "## Release notes" section of the release PR description.
          #    This is the reliable source when work reaches main as squash commits.
          NOTES=$(printf '%s\n' "$PR_BODY" | tr -d '\r' | awk '
            tolower($0) ~ /^##[ \t]+release notes[ \t]*$/ { found = 1; next }
            found && /^##[ \t]/ { exit }
            found { print }
          ')

          if [ -n "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            BODY="## What's Changed"$'\n\n'"$NOTES"
          else
            # 2. Otherwise group the release PR's own commits by conventional-commit type.
            LINES=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" \
              --jq '.[] | select((.parents | length) == 1) | "\(.sha)\t\(.commit.message | split("\n")[0])"' 2>/dev/null || true)

            # 3. Last resort: commits since the previous tag.
            if [ -z "$LINES" ]; then
              RANGE="HEAD"
              [ -n "$PREV_TAG" ] && RANGE="$PREV_TAG..HEAD"
              LINES=$(git log $RANGE --no-merges --pretty=format:"%H${TAB}%s")
            fi

            LIST=$(printf '%s\n' "$LINES" \
              | grep -v -E "^[0-9a-f]+${TAB}(chore: bump version|Merge )" \
              | while IFS="$TAB" read -r sha subject; do
                  [ -n "$sha" ] && echo "- $subject ([${sha:0:7}](https://github.com/$REPO/commit/$sha))"
                done)

            get_section() { printf '%s\n' "$LIST" | grep -E "^- $1" || true; }
            FEATURES=$(get_section "feat[(:!]")
            FIXES=$(get_section "fix[(:!]")
            REFACTOR=$(get_section "refactor[(:!]")
            DOCS=$(get_section "docs[(:!]")
            CHORES=$(get_section "chore[(:!]")
            OTHER=$(printf '%s\n' "$LIST" | grep -v -E "^- (feat|fix|chore|refactor|docs|ci|test|build|style|perf)[(:!]" || true)

            BODY="## What's Changed"$'\n'
            [ -n "$FEATURES" ] && BODY="$BODY"$'\n'"### Features"$'\n'"$FEATURES"$'\n'
            [ -n "$FIXES" ]    && BODY="$BODY"$'\n'"### Bug Fixes"$'\n'"$FIXES"$'\n'
            [ -n "$REFACTOR" ] && BODY="$BODY"$'\n'"### Refactoring"$'\n'"$REFACTOR"$'\n'
            [ -n "$DOCS" ]     && BODY="$BODY"$'\n'"### Documentation"$'\n'"$DOCS"$'\n'
            [ -n "$CHORES" ]   && BODY="$BODY"$'\n'"### Chores"$'\n'"$CHORES"$'\n'
            [ -n "$OTHER" ]    && BODY="$BODY"$'\n'"### Other Changes"$'\n'"$OTHER"$'\n'
          fi

          if [ -n "$PREV_TAG" ]; then
            BODY="$BODY"$'\n\n'"**Full Changelog**: https://github.com/$REPO/compare/$PREV_TAG...$TAG"
          fi

          # Random delimiter: the body comes from a PR description, so it must not be able to end the output early.
          DELIM="CHANGELOG_$(date +%s%N)"
          {
            echo "body<<$DELIM"
            echo "$BODY"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Create tag
        run: |
          git tag ${{ steps.bump.outputs.tag }}
          git push origin ${{ steps.bump.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false

  docker:
    needs: release
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release.outputs.version }}
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
